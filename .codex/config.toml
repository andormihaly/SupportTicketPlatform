[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.dotnet-roslyn]
command = "dotnet-roslyn-mcp"
args = [
  "--solution",
  "SupportTicketPlatform.slnx"
]

[mcp_servers.dotnet-roslyn.tools.get_project_info]
approval_mode = "approve"

[mcp_servers.dotnet-roslyn.tools.get_dependency_graph]
approval_mode = "approve"

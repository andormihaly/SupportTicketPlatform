
name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aks-production
  cancel-in-progress: false

env:
  ACR_NAME: andorsupportticketacr
  ACR_LOGIN_SERVER: andorsupportticketacr.azurecr.io
  AKS_RESOURCE_GROUP: andorkubernetes
  AKS_CLUSTER_NAME: support-ticket-aks
  K8S_NAMESPACE: support-ticket

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build API image
        run: docker build -f src/SupportTicketPlatform.Api/Dockerfile -t $ACR_LOGIN_SERVER/support-ticket-platform-api:${{ github.sha }} .

      - name: Push API image
        run: docker push $ACR_LOGIN_SERVER/support-ticket-platform-api:${{ github.sha }}

      - name: Build Worker image
        run: docker build -f src/SupportTicketPlatform.Worker/Dockerfile -t $ACR_LOGIN_SERVER/support-ticket-platform-worker:${{ github.sha }} .

      - name: Push Worker image
        run: docker push $ACR_LOGIN_SERVER/support-ticket-platform-worker:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: latest

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group $AKS_RESOURCE_GROUP --name $AKS_CLUSTER_NAME --overwrite-existing

      - name: Configure AKS authentication
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Deploy API
        run: kubectl set image deployment/support-ticket-api api=$ACR_LOGIN_SERVER/support-ticket-platform-api:${{ github.sha }} -n $K8S_NAMESPACE

      - name: Deploy Worker
        run: kubectl set image deployment/support-ticket-worker worker=$ACR_LOGIN_SERVER/support-ticket-platform-worker:${{ github.sha }} -n $K8S_NAMESPACE

      - name: Verify API rollout
        run: kubectl rollout status deployment/support-ticket-api -n $K8S_NAMESPACE --timeout=300s

      - name: Verify Worker rollout
        run: kubectl rollout status deployment/support-ticket-worker -n $K8S_NAMESPACE --timeout=300s
